# Compila el sitio y lo sube a Hostinger por SSH en cada push a master.
#
# Secrets necesarios (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST         IP o host del acceso SSH de Hostinger
#   SSH_PORT         Puerto SSH (normalmente 65002)
#   SSH_USER         Usuario SSH (ej. u123456789)
#   SSH_PRIVATE_KEY  Llave privada cuya pública está registrada en hPanel
#   REMOTE_PATH      Carpeta del sitio (ej. domains/pereidanet.me/public_html)

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # --delete quita del servidor lo que ya no existe en dist/.
      # .well-known se excluye para no borrar validaciones de SSL u otros servicios.
      - name: Subir dist/ a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -az --delete --exclude ".well-known" \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            dist/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"
